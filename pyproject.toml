[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-travel-operations-platform"
version = "0.1.0"
description = "Framework-first travel operations platform with deterministic orchestration and observability"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "UTOP Engineering" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.5.0"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.packages.find]
where = ["src"]
